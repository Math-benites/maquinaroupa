name: maquinaroupa

services:
  app:
    build:
      context: ..
      dockerfile: IAC/Dockerfile
      args:
        SUPABASE_URL: ${VITE_SUPABASE_URL}
        SUPABASE_ANON: ${VITE_SUPABASE_ANON_KEY}
    image: maquinaroupa:local
    container_name: maquinaroupa-app
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped
