server {
  listen 8080;
  server_name _;
  server_tokens off;
  add_header_inherit merge;

  # DEMO INTENCIONAL: CSP removida de proposito para print do OWASP ZAP. Reativar depois.
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  root /usr/share/nginx/html;
  index index.html;

  # Injeta a tag do runtime-config na resposta HTTP, sem tocar no arquivo
  # em disco. index.html buildado nao referencia esse script (senao no
  # deploy estatico via Cloudflare Workers, sem esse nginx, a tag apontaria
  # pra um arquivo inexistente). Fazer isso via sed em disco no entrypoint
  # tambem quebrava o diff fat/slim do SlimToolkit no CI.
  sub_filter '<head>' '<head><script src="/runtime-config.js"></script>';
  sub_filter_once on;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Gerado pelo entrypoint a cada start do container - nunca cachear feito
  # asset versionado, senao o cliente fica preso numa config antiga (URL
  # do Supabase trocada, chave rotacionada, etc) ate o cache expirar.
  location = /runtime-config.js {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
