name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    environment: sonarqubekey
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if SONARQUBEKEY secret is configured
        id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBEKEY }}
        run: echo "configured=${{ secrets.SONARQUBEKEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: SonarQube Scan
        if: steps.check.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBEKEY }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}

      # A análise em si (bugs, vulnerabilidades, security hotspots) já
      # roda e fica salva no dashboard do SonarCloud no step acima. Esse
      # step só tenta aplicar o Quality Gate como um gate extra de
      # pass/fail; continue-on-error porque no plano free o projeto pode
      # não ter um Quality Gate configurável, e isso não deve travar
      # o pipeline por uma limitação de plano, não uma vulnerabilidade.
      - name: SonarQube Quality Gate
        if: steps.check.outputs.configured == 'true'
        continue-on-error: true
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBEKEY }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
