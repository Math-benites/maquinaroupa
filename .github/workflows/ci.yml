name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Typecheck + build
        run: npm run build

  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    environment: sonarqubekey
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if SONARQUBEKEY secret is configured
        id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBEKEY }}
        run: echo "configured=${{ secrets.SONARQUBEKEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: SonarQube Scan
        if: steps.check.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBEKEY }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}

      # O plano free não expõe Quality Gate configurável pro projeto, então
      # em vez de depender dele, consultamos a API do SonarCloud direto:
      # falha se houver issue MAJOR/CRITICAL/BLOCKER não resolvida, ou
      # security hotspot pendente de revisão.
      - name: Wait for analysis processing
        if: steps.check.outputs.configured == 'true'
        id: wait
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBEKEY }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          set -e
          TASK_ID=$(grep '^ceTaskId=' .scannerwork/report-task.txt | cut -d= -f2)
          STATUS="PENDING"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/ce/task?id=$TASK_ID" | jq -r '.task.status')
            echo "status=$STATUS"
            if [ "$STATUS" = "SUCCESS" ] || [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELED" ]; then
              break
            fi
            sleep 5
          done
          if [ "$STATUS" != "SUCCESS" ]; then
            echo "::error::Processamento da análise terminou com status $STATUS"
            exit 1
          fi

      - name: Fail on MAJOR+ issues or pending security hotspots
        if: steps.check.outputs.configured == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBEKEY }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          PROJECT_KEY: maquinaroupa
        run: |
          set -e
          ISSUES=$(curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/issues/search?componentKeys=$PROJECT_KEY&severities=BLOCKER,CRITICAL,MAJOR&resolved=false&ps=1" | jq -r '.total')
          HOTSPOTS=$(curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/hotspots/search?projectKey=$PROJECT_KEY&status=TO_REVIEW&ps=1" | jq -r '.paging.total')
          echo "Issues MAJOR ou piores: $ISSUES"
          echo "Security hotspots pendentes: $HOTSPOTS"
          if [ "$ISSUES" -gt 0 ] || [ "$HOTSPOTS" -gt 0 ]; then
            echo "::error::SonarQube encontrou $ISSUES issue(s) MAJOR+ e $HOTSPOTS security hotspot(s) pendentes. Veja $SONAR_HOST_URL/dashboard?id=$PROJECT_KEY"
            exit 1
          fi
