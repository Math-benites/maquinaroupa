name: CI

on:
  push:
    branches: [security, master]
  pull_request:
    branches: [security]

permissions:
  contents: read

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    if: github.ref_name != 'master'
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    if: github.ref_name != 'master'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy (dependency vulnerabilities)
    runs-on: ubuntu-latest
    if: github.ref_name != 'master'
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  # O plano free do SonarCloud só analisa a branch principal (master),
  # branches curtas não são suportadas — por isso esse job roda só nela,
  # enquanto os demais rodam só na branch security.
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    if: github.ref_name == 'master'
    environment: sonarqubekey
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if SONARQUBEKEY secret is configured
        id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBEKEY }}
        run: echo "configured=${{ secrets.SONARQUBEKEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: SonarQube Scan
        if: steps.check.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBEKEY }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}

      # A action acima só reporta a análise; sem isso, o step some verde
      # mesmo com vulnerabilidade/bug crítico encontrado pelo SonarQube.
      - name: SonarQube Quality Gate
        if: steps.check.outputs.configured == 'true'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBEKEY }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
